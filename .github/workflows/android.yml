name: APK Android

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK assinado
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          set -o pipefail
          gradle assembleRelease --no-daemon --stacktrace 2>&1 | tee build.log

      - name: Publicar release "latest"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/release/app-release.apk MyAtlas.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest MyAtlas.apk \
            --title "My Atlas — build ${{ github.run_number }}" \
            --notes "Baixe o arquivo MyAtlas.apk no celular Android e instale. Atualizações futuras instalam por cima, sem perder nada."

      - name: Registrar status do build
        if: always()
        run: |
          mkdir -p /tmp/status && cd /tmp/status
          git init -q -b ci-status
          git config user.name "atlas-bot"
          git config user.email "atlas-bot@users.noreply.github.com"
          echo "${{ job.status }} run=${{ github.run_number }} sha=${{ github.sha }}" > status.txt
          tail -n 250 "$GITHUB_WORKSPACE/android/build.log" > build.log 2>/dev/null || echo "sem log" > build.log
          git add . && git commit -qm "build ${{ github.run_number }}: ${{ job.status }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" ci-status
