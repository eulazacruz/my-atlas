<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
<title>Voltando para o My Atlas</title>
<style>
  html,body{margin:0;height:100%;background:#030303;color:#fff;font-family:-apple-system,system-ui,Roboto,sans-serif}
  main{min-height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;box-sizing:border-box}
  img{width:84px;height:84px;border-radius:24px;box-shadow:0 10px 40px rgba(255,255,255,.08)}
  h1{font-size:22px;margin:22px 0 6px;letter-spacing:-.02em}
  p{color:rgba(255,255,255,.55);font-size:14px;margin:0 0 28px;max-width:300px;line-height:1.45}
  a{display:block;width:100%;max-width:320px;height:52px;line-height:52px;border-radius:999px;background:#fff;color:#000;font-weight:700;font-size:16px;text-decoration:none}
  small{margin-top:18px;color:rgba(255,255,255,.35);font-size:12px}
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="" />
  <h1 id="t">Login concluído ✓</h1>
  <p id="m">Toque no botão para voltar ao aplicativo.</p>
  <a id="go" href="#">Voltar para o My Atlas</a>
  <small>Se nada acontecer, feche esta aba e abra o app.</small>
</main>
<script>
  (function () {
    var q = location.search.slice(1) || location.hash.slice(1);
    var params = new URLSearchParams(q);
    params.delete('app');
    var rest = params.toString();
    var intent = 'intent://auth' + (rest ? '?' + rest : '') + '#Intent;scheme=app.myatlas;package=app.myatlas.twa;end';
    var plain = 'app.myatlas://auth' + (rest ? '?' + rest : '');
    var isAndroid = /Android/i.test(navigator.userAgent);
    var url = isAndroid ? intent : plain;
    if (params.get('error') || params.get('error_description')) {
      document.getElementById('t').textContent = 'Não deu para entrar';
      document.getElementById('m').textContent = 'Volte ao app e tente de novo.';
    }
    document.getElementById('go').href = url;
    setTimeout(function () { location.href = url; }, 150);
  })();
</script>
</body>
</html>
